[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-shard"
version = "0.1.0"
description = "Split monolithic AI plans into executable shards; apply targeted feedback to one shard at a time"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hao li"}]
keywords = ["ai-agents", "claude-code", "plan-mode", "markdown", "cli"]

[project.scripts]
plan-shard = "plan_shard.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/plan-shard"

[tool.setuptools.packages.find]
include = ["plan_shard*"]
